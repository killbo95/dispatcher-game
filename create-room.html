<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Room — Dispatcher Ops</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="card standalonePage">
      <a class="smallButton pageBack" href="./index.html">← Main Menu</a>
      <div class="menuKicker">DISPATCHER OPS</div>
      <h1>Create a Room</h1>
      <p class="muted">Set up your player, then the game will create the live room connection.</p>

      <div class="roomSetupCard">
        <label>
          Your Name
          <input id="createName" type="text" maxlength="24" placeholder="Your name" value="Player">
        </label>

        <label>
          Your Role
          <select id="createRole">
            <option value="dispatcher">Dispatcher</option>
            <option value="victim">Victim</option>
          </select>
        </label>

        <label>
          Room Code
          <input id="createRoomCode" type="text" maxlength="24" placeholder="CITY-247">
        </label>

        <div class="buttonRow">
          <button id="newCode" type="button">Generate New Code</button>
          <button id="createRoomButton" class="pageAction" type="button">Open Room</button>
        </div>
        <div id="createRoomStatus" class="lobbyStatus">Ready.</div>
      </div>
    </section>
  </main>

  <script>
    const nameInput = document.getElementById("createName");
    const roleInput = document.getElementById("createRole");
    const roomInput = document.getElementById("createRoomCode");
    const button = document.getElementById("createRoomButton");
    const newCode = document.getElementById("newCode");
    const status = document.getElementById("createRoomStatus");

    function makeRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return "ROOM-" + code;
    }

    function generateCode() {
      roomInput.value = makeRoomCode();
    }

    generateCode();
    newCode.addEventListener("click", generateCode);

    button.addEventListener("click", () => {
      const name = nameInput.value.trim() || "Player";
      const role = roleInput.value;
      const roomCode = roomInput.value.trim().toUpperCase();

      if (!roomCode) {
        status.textContent = "Enter a room code first.";
        return;
      }

      sessionStorage.setItem("dispatcherName", name);
      sessionStorage.setItem("dispatcherRole", role);
      sessionStorage.setItem("dispatcherRoom", roomCode);
      sessionStorage.setItem("dispatcherCreated", "true");

      status.textContent = "Opening the live room...";
      window.location.href = "./game.html?mode=create&room=" + encodeURIComponent(roomCode);
    });
  </script>
</body>
</html>
